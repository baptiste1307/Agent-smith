[project]
name = "agent-smith"
version = "1.0.0"
description = "Autonomous AI Agent"
requires-python = ">=3.10"
dependencies = [
    "pydantic",
    "httpx",
    "mcp>=1.22,<2",
    "python-dotenv",
]

[project.scripts]
sandbox = "sandbox.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sandbox", "agent", "llm", "tools", "docker_env", "mcp_client"]
